# Benchmark configuration for the Snakemake workflow.
dataset: "../dataset"          # folder with genome.fa, annotation.gtf, reads_*.fastq.gz, truth_*
threads: 4
base_tol: 2                    # baseline breakpoint tolerance added to per-junction tolerance
ciri2_path: "CIRI2.pl"         # name on PATH, or absolute path to CIRI2.pl

# bsj_finder (the pipeline being benchmarked): Snakemake pipeline added as submodule
bsj_finder_dir: "../bsj_finder/"           # bsj_finder repo root, relative to this benchmark/ dir
bsj_finder_merge_tol: 12        # cluster per-read breakpoints within this many bp into one call

tools:
  - circexplorer2
  - ciri2
  - bsj_finder

# Full factorial: {pe, se} x {150, 100} bp x {lowerr, higherr} = 8 libraries.
# Read length and library layout vary independently, so a PE-vs-SE difference can be
# attributed to the mate-pair signal rather than to read length. Drop entries here to
# benchmark a subset (e.g. keep only pe150_*/se150_* to hold read length fixed).
libraries:
  pe150_lowerr:
    type: pe
    r1: reads_pe150_lowerr_R1.fastq.gz
    r2: reads_pe150_lowerr_R2.fastq.gz
    overhang: 149
  pe150_higherr:
    type: pe
    r1: reads_pe150_higherr_R1.fastq.gz
    r2: reads_pe150_higherr_R2.fastq.gz
    overhang: 149
  pe100_lowerr:
    type: pe
    r1: reads_pe100_lowerr_R1.fastq.gz
    r2: reads_pe100_lowerr_R2.fastq.gz
    overhang: 99
  pe100_higherr:
    type: pe
    r1: reads_pe100_higherr_R1.fastq.gz
    r2: reads_pe100_higherr_R2.fastq.gz
    overhang: 99
  se150_lowerr:
    type: se
    r1: reads_se150_lowerr.fastq.gz
    overhang: 149
  se150_higherr:
    type: se
    r1: reads_se150_higherr.fastq.gz
    overhang: 149
  se100_lowerr:
    type: se
    r1: reads_se100_lowerr.fastq.gz
    overhang: 99
  se100_higherr:
    type: se
    r1: reads_se100_higherr.fastq.gz
    overhang: 99

  # Strandedness variants. All libraries above are FORWARD-stranded (R1 = transcript sense).
  # These re-emit the *same fragments* as pe150_lowerr / se150_lowerr with only the strand
  # protocol changed (see dataset/libraries.tsv), so compare each against its base library:
  #   *_rev    reverse-stranded (dUTP, typical total RNA-seq): R1 antisense
  #   *_unstr  unstranded: each fragment fwd or rev at random
  # evaluate.py scores the strand each caller reports (strand_accuracy, recall_strand).
  pe150_lowerr_rev:
    type: pe
    r1: reads_pe150_lowerr_rev_R1.fastq.gz
    r2: reads_pe150_lowerr_rev_R2.fastq.gz
    overhang: 149
  pe150_lowerr_unstr:
    type: pe
    r1: reads_pe150_lowerr_unstr_R1.fastq.gz
    r2: reads_pe150_lowerr_unstr_R2.fastq.gz
    overhang: 149
  se150_lowerr_rev:
    type: se
    r1: reads_se150_lowerr_rev.fastq.gz
    overhang: 149
  se150_lowerr_unstr:
    type: se
    r1: reads_se150_lowerr_unstr.fastq.gz
    overhang: 149
