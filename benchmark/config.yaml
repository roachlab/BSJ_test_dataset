# Benchmark configuration for the Snakemake workflow.
dataset: "../dataset"          # folder with genome.fa, annotation.gtf, reads_*.fastq.gz, truth_*
threads: 4
base_tol: 2                    # baseline breakpoint tolerance added to per-junction tolerance
ciri2_path: "CIRI2.pl"         # name on PATH, or absolute path to CIRI2.pl

tools:
  - circexplorer2
  - ciri2

libraries:
  pe_lowerr:
    type: pe
    r1: reads_pe_lowerr_R1.fastq.gz
    r2: reads_pe_lowerr_R2.fastq.gz
    overhang: 149
  pe_higherr:
    type: pe
    r1: reads_pe_higherr_R1.fastq.gz
    r2: reads_pe_higherr_R2.fastq.gz
    overhang: 149
  se_lowerr:
    type: se
    r1: reads_se_lowerr.fastq.gz
    overhang: 99
  se_higherr:
    type: se
    r1: reads_se_higherr.fastq.gz
    overhang: 99
